<!doctype html>
<html lang="en">
<head>
<title>Audio Offline Visualizer</title>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#ffffff">
<link rel="stylesheet" href="/src/index.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=block" rel="stylesheet">
<script>
  (function() {
    try {
      var originalFetch = window.fetch;
      var customFetch = originalFetch;
      Object.defineProperty(window, 'fetch', {
        get: function() {
          return customFetch;
        },
        set: function(val) {
          customFetch = val;
        },
        configurable: true,
        enumerable: true
      });
    } catch (e) {
      console.warn("Failed to redefine window.fetch property:", e);
    }
  })();

  globalThis.litIssuedWarnings = new Set(['dev-mode']);

  const originalWarn = console.warn;
  console.warn = function(...args) {
    if (args[0] && typeof args[0] === 'string' && (args[0].includes('Lit is in dev mode') || args[0].includes('lit-html is in dev mode') || args[0].includes('in dev mode'))) return;
    originalWarn.apply(console, args);
  };
  const originalDebug = console.debug;
  console.debug = function(...args) {
    if (args[0] && typeof args[0] === 'string' && args[0].includes('[vite]')) return;
    originalDebug.apply(console, args);
  };
  const originalLog = console.log;
  console.log = function(...args) {
    if (args[0] && typeof args[0] === 'string' && args[0].includes('[vite]')) return;
    if (args[0] === 'CONNECTED') return;
    originalLog.apply(console, args);
  };
</script>
</head>
<body>
  <gdm-live-audio></gdm-live-audio>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
