<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=block" rel="stylesheet">
<script>
  // Robust fetch descriptor fix for sandboxed iframe environments where fetch is getter-only on Window/Window.prototype
  (function() {
    try {
      let _fetch = typeof window !== 'undefined' && window.fetch ? window.fetch.bind(window) : globalThis.fetch;
      try {
        Object.defineProperty(window, 'fetch', {
          get() {
            return _fetch;
          },
          set(fn) {
            _fetch = fn;
          },
          configurable: true,
          enumerable: true
        });
      } catch (e) {
        try {
          const proto = Object.getPrototypeOf(window);
          if (proto) {
            Object.defineProperty(proto, 'fetch', {
              get() {
                return _fetch;
              },
              set(fn) {
                _fetch = fn;
              },
              configurable: true,
              enumerable: true
            });
          }
        } catch (e2) {}
      }
    } catch (err) {}
  })();

  globalThis.litIssuedWarnings = new Set(['dev-mode']);

  const originalWarn = console.warn;
  console.warn = function(...args) {
    if (args[0] && typeof args[0] === 'string' && (args[0].includes('Lit is in dev mode') || args[0].includes('lit-html is in dev mode') || args[0].includes('in dev mode'))) return;
    originalWarn.apply(console, args);
  };
  const originalDebug = console.debug;
  console.debug = function(...args) {
    if (args[0] && typeof args[0] === 'string' && args[0].includes('[vite]')) return;
    originalDebug.apply(console, args);
  };
  const originalLog = console.log;
  console.log = function(...args) {
    if (args[0] && typeof args[0] === 'string' && args[0].includes('[vite]')) return;
    if (args[0] === 'CONNECTED') return;
    originalLog.apply(console, args);
  };
</script>
</head>
<body>
  <gdm-live-audio></gdm-live-audio>
<script type="module" src="/src/main.tsx"></script>
</body>
